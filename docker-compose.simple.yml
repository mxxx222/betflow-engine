version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=betflow
      - POSTGRES_USER=betflow_user
      - POSTGRES_PASSWORD=betflow_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betflow_user -d betflow"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # FastAPI Backend (simplified)
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - USE_MOJO=1
      - SLO_P95_MS=1
      - SLO_P99_MS=5
      - MAX_FALLBACK_RATIO=0.05
      - PILOT_TRAFFIC=10
      - DATABASE_URL=postgresql://betflow_user:betflow_pass@postgres:5432/betflow
      - REDIS_URL=redis://redis:6379
      - API_RATE_LIMIT=1000
      - JWT_SECRET=pilot_jwt_secret_2024
      - ADMIN_EMAIL=admin@betflow-engine.com
      - PROVIDERS_ODDS_API_KEY=demo_key
      - PROVIDERS_SPORTS_MONKS_KEY=demo_key
      - N8N_WEBHOOK_URL=http://worker:5678/webhook
      - ENVIRONMENT=pilot
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=true
      - ENABLE_HEALTH_CHECKS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SLO Monitor
  slo-monitor:
    build: ./monitoring
    environment:
      - API_URL=http://api:8000
      - MONITORING_INTERVAL=30
      - P95_MAX_MS=1.0
      - P99_MAX_MS=5.0
      - ERROR_MAX=0.001
      - FALLBACK_MAX=0.05
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge

