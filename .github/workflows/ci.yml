name: BetFlow Engine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r engine/requirements.txt
        pip install -r monitoring/requirements.txt
    
    - name: Run linting
      run: |
        flake8 api/ engine/ --max-line-length=100 --exclude=migrations
        black --check api/ engine/
    
    - name: Run API tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/betflow_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret
      run: |
        cd api
        python -m pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Run engine tests
      run: |
        cd engine
        python -m pytest tests/ -v --cov=engine --cov-report=xml
    
    - name: Run benchmark suite
      run: |
        cd engine
        python benchmarks.py
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./api/coverage.xml,./engine/coverage.xml
        fail_ci_if_error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: false
        tags: betflow-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Engine image
      uses: docker/build-push-action@v5
      with:
        context: ./engine
        push: false
        tags: betflow-engine:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Web image
      uses: docker/build-push-action@v5
      with:
        context: ./web
        push: false
        tags: betflow-web:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  performance:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r engine/requirements.txt
        pip install psutil
    
    - name: Run comprehensive benchmarks
      run: |
        cd engine
        python benchmarks.py
    
    - name: Performance regression check
      run: |
        echo "Checking for performance regressions..."
        # This would compare against baseline metrics in production
        echo "Performance check passed"

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [test, build, security, performance]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Staging deployment commands would go here
        echo "Staging deployment completed"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [test, build, security, performance]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production (canary)
      run: |
        echo "Starting canary deployment to production..."
        # Production canary deployment commands would go here
        echo "Canary deployment initiated"