[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betflow-engine"
version = "0.9.0"
description = "High-performance sports analytics calculation engine with Mojo acceleration"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "BetFlow Team", email = "team@betflow-engine.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
betflow-benchmark = "engine.benchmarks:run_ci_benchmarks"

[project.urls]
Homepage = "https://github.com/betflow/betflow-engine"
Documentation = "https://docs.betflow-engine.com"
Repository = "https://github.com/betflow/betflow-engine"
"Bug Tracker" = "https://github.com/betflow/betflow-engine/issues"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["*.mojo", "*.so", "*.dylib", "*.dll"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=engine --cov-report=html --cov-report=term-missing"
